# @package _global_
# =============================================================================
# Experiment Configuration — Final Task B: 17-class Species Classification
# =============================================================================

# Experiment identifier
experiment_name: taskB_species_classification

data_root: data/task-B-group-split

# Task definition
task:
  id: taskB
  name: Species Classification
  description: Final 17-class species-level classification with origin-safe splits
  num_classes: 17

# Model config overrides
model:
  _target_: model.base
  num_classes: 17
  family_classes: null  # Not needed for Task B

# Training config
train:
  _target_: train.base
  epochs: 50
  wandb:
    project: woodbench-taskB-17class

# Evaluation
evaluation:
  test_evaluation: true
  per_class_metrics: true
  confusion_matrix: true
  save_predictions: false
