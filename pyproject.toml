[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "woodbench"
version = "0.1.0"
description = "Wood species classification benchmark"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "timm",
    "huggingface_hub",
    "scikit-learn",
    "pandas",
    "numpy",
    "pillow",
    "tqdm",
]
